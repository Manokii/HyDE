# Personal preferences
# we're doing it here to avoid configs with above

dwindle {
    preserve_split = true
}

general {
  snap {
    respect_gaps = true
  }
}

# check .local/share/hypr/ for some manual overrides
# - overridden waybar with hyprpanel
# - disabled dunst because hyprpanel does notifications


#  // █░░ █▀█ █▀▀ █▄▀ █▀ █▀▀ █▀█ █▀▀ █▀▀ █▄░█
#  // █▄▄ █▄█ █▄▄ █░█ ▄█ █▄▄ █▀▄ ██▄ ██▄ █░▀█

#Setting the Hyprlock layout will override any layout set in the ./hypr/hyprlock.sh
# Dynamic Hyprlock layout should be set in the ./hypr/hyprlock.sh file
# $LAYOUT_PATH=/path/to/hyprlock/layout.conf



# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░

input {
    follow_mouse = 2
    sensitivity = 0.3
    force_no_accel = 1
}


