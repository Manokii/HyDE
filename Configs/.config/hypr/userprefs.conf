# PERSONAL
env = SSH_AUTH_SOCK,~/.1password/agent.sock 
exec-once = ln -s "$HOME/.config/hypr/device-config/device-$HOST.conf" "$HOME/.config/hypr/device-config/current.conf" 2> /dev/null || true
source = ./device-config/current.conf
exec-once = hyprpm reload -n


