## █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀ █ █░▀█ █▄█ ▄█


$mainMod = Super # super / meta / windows key

unbind = $mainMod, A # default App launcher
unbind = $mainMod, L # default lock screen
unbind = $mainMod, W # default close focused window
unbind = $mainMod, J # default toggle split
unbind = $mainMod, K # default keyboard layout
unbind = $mainMod, V # default clipboard history
unbind = $mainMod, Q # default quit
unbind = $mainMod, C # default code editor

unbind = $mainMod Shift, R # default
unbind = $mainMod Shift, T # default
unbind = $mainMod Shift, A # default
unbind = $mainMod Shift, W # default
unbind = $mainMod Shift, E # default
unbind = $mainMod Shift, G # default

unbind = , F10 # default volume mute toggle
unbind = , F11 # default volume down
unbind = , F12 # default volume up


$hc=Hardware Controls
$d=[$hc|Audio]
binddl  = , F10, $d toggle mute output , exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # toggle audio mute
binddel = , F11, $d decrease volume , exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddel = , F12, $d increase volume , exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
 

$wm=Window Management
$d=[$wm]
bindd = $mainMod, V, $d toggle float, togglefloating
bindd = $mainMod, V, $d toggle float, centerwindow
bindd = $mainMod, V, $d toggle float, centerwindow
bindd = $mainMod, Backspace, $d session menu, global, caelestia:session
bindd = $mainMod Control, Escape, $d lock screen, exec, caelestia shell lock lock
bindd = $mainMod Control, R, $d restart caelestia shell, exec, caelestia shell -k; sleep 0.5; caelestia shell -d
bindd = $mainMod, W, $d close focused window, exec, $scrPath/dontkillsteam.sh
bindd = $mainMod, Q, $d terminal emulator , exec, $TERMINAL
bindd = $mainMod, D, $d toggle scratchpad , togglespecialworkspace, ai


$d=[$wm|Change focus]
bindd = $mainMod, H, $d focus left, movefocus, l
bindd = $mainMod, L, $d focus right , movefocus, r
bindd = $mainMod, K, $d focus up , movefocus, u
bindd = $mainMod, J , $d focus down, movefocus, d

bindd = $mainMod Control, j, $d change active workspace forwards  , workspace, r+1
bindd = $mainMod Control, k, $d change active workspace backwards , workspace, r-1

$d=[$wm|Resize Active Window]
bindde = $mainMod Shift, L, $d resize window right , resizeactive, 30 0
bindde = $mainMod Shift, H, $d resize window left, resizeactive, -30 0
bindde = $mainMod Shift, K, $d resize window up, resizeactive, 0 -30
bindde = $mainMod Shift, J, $d resize  window down, resizeactive, 0 30


$d=[$wm|Move active window across workspace]
bindde = $mainMod Shift Control, H, Move activewindow to the right, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Shift Control, L, Move activewindow to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = $mainMod Shift Control, K, Move activewindow to the right, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Shift Control, J, Move activewindow to the right, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d


$d=[$wm|Move & Resize with mouse]
bindd = Alt, return, $d maximize, fullscreen, 2
bindd = Shift Alt, return, $d maximize, fullscreen, 1


# Toggle focused window split
$d=[$wm]
bindd = $mainMod Alt, J, $d toggle split, layoutmsg, togglesplit
bindd = $mainMod Alt, Return, $d toggle split, exec, $scrPath/gamemode.sh



$l=Launcher
$d=[$l|Apps]
bindd = $mainMod, N, $d notifications, exec, hyprpanel t notificationsmenu
bindd = CTRL Shift, space, $d 1password quick-access , exec, 1password --quick-access # open 1password quick access
bindd = $mainMod, A, $d, global, caelestia:launcher


$hc=Hardware Controls
$d=[$hc|Audio]
bindd = $mainMod CTRL, V, $d select output device , exec, hyprpanel t audiomenu
bindd = $mainMod, O, $d select audio output , exec, pkill -x rofi || $scrPath/audioselect.sh sink
bindd = $mainMod, I, $d select audio input , exec, pkill -x rofi || $scrPath/audioselect.sh source

$d=[$hc|Bluetooth]
bindd = $mainMod, U, $d connect bluetooth device , exec, pkill -x rofi || $scrPath/btconnect.sh


$ut=Utilities
$d=[$ut|Screenshot]
bindd = $mainMod Shift Alt, P, $d snip screen ignoring no_screen_share, exec, screenshot-unblocked s
binddl = $mainMod Shift Alt, M, $d print monitor ignoring no_screen_share, exec, screenshot-unblocked m

$d=[$ut|Privacy]
bindd = $mainMod Shift Alt, S, $d toggle screen-share protection, exec, noscreenshare-toggle


$ut=Utilities
$ws=Workspaces

$d=#! unset the group name


# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

source = ./userprefs.windowrules.conf


cursor {
    no_hardware_cursors = 0
}

# Match caelestia's screen frame (shell.json: border.rounding 25, thickness 10).
# Concentric corners: with the window inset by gaps_out, its radius must be
# frame radius minus that inset (25 - 8 = 17) or the arcs are not parallel.
# Caelestia rewrites this on every scheme change (utils/theme.py apply_hypr).
# Hyprland watches sourced files, so the border repaints without manual reload.
# hyprlang noerror true
source = ./scheme/current.conf
# hyprlang noerror false

general {
    gaps_out = 8
    col.active_border = rgba($primaryff) rgba($tertiaryff) 45deg
    col.inactive_border = rgba($outlineVariantcc) rgba($outlinecc) 45deg
}

decoration {
    rounding = 17
}

