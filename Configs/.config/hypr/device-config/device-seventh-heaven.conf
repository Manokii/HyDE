# WORKSPACES
workspace = 1, monitor:desc:LG Electronics LG ULTRAGEAR+ 512NTKFF2261, default:true
workspace = 2, monitor:desc:LG Electronics LG ULTRAGEAR+ 512NTKFF2261
workspace = 3, monitor:desc:LG Electronics LG ULTRAGEAR+ 512NTKFF2261
workspace = 4, monitor:desc:LG Electronics LG ULTRAGEAR+ 512NTKFF2261
workspace = 5, monitor:desc:LG Electronics LG ULTRAGEAR+ 512NTKFF2261
workspace = 6, monitor:desc:Cyrix Corporation XENEON EDGE 040625415656, default:true 
workspace = 7, monitor:desc:Cyrix Corporation XENEON EDGE 040625415656
workspace = 8, monitor:desc:Cyrix Corporation XENEON EDGE 040625415656
workspace = 9, monitor:desc:Cyrix Corporation XENEON EDGE 040625415656
workspace = 10, monitor:desc:Cyrix Corporation XENEON EDGE 040625415656

# workspace = 8, monitor:desc:Samsung Electric Company S24R35x H4TN901181, default:true
# workspace = 9, monitor:desc:Samsung Electric Company S24R35x H4TN901181
# workspace = 10, monitor:desc:Samsung Electric Company S24R35x H4TN901181
 
workspace = special:ai, on-created-empty:[float; center; size 50% 80%; noblur; animation slide top; noscreenshare; opaque; workspace special:ai ] $TERMINAL -e opencode

# workspace = special:special, monitor:desc:LG Electronics LG ULTRAGEAR+ 512NTKFF2261, gapsout:0
workspace = m[HDMI-A-1], gapsin:0, gapsout:0, rounding:0, bordersize:0
workspace = special:special, gapsout:100, rounding:100
# workspace = 6, on-created-empty:discord
# workspace = 6, on-created-empty: hyprctl dispatch exec '$TERMINAL --title="btop" -e btop' \
#                       && sleep 0.3 \
#                       && hyprctl dispatch exec 'discord' \
#                       && sleep 2 \
#                       && hyprctl dispatch focuswindow 'title:btop' \
#                       && sleep 0.3 \
#                       && hyprctl dispatch exec '$TERMINAL -e cava' \
#                       && sleep 0.3 \
#                       && hyprctl dispatch focusmonitor 'desc:Cyrix Corporation XENEON EDGE 040625415656' \


gesture = 3, down, workspace
# gesture = 1, vertical, workspace

cursor {
    no_hardware_cursors = 0
    no_warps = 0
}


input {
    touchdevice {
      enabled = true
      output = HDMI-A-1
    }
}



plugin {
      touch_gestures {
          sensitivity = 4.0
          workspace_swipe_fingers = 3
          edge_margin = 10
          emulate_touchpad_swipe = true
          hyprgrass-bind = , edge:r:l, workspace, +1
          hyprgrass-bind = , edge:d:u, exec, firefox
          hyprgrass-gesture = edge, up, down, special
    }
}


gestures {
    workspace_swipe_create_new = true
}
