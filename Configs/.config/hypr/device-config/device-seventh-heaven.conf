monitorv2 {
  output = desc:LG Electronics LG ULTRAGEAR+ 512NTKFF2261
  # 4K@144 leaves DP 1.4 bandwidth headroom and avoids DSC link-training failures
  # that caused intermittent black-screen / TTY-fallback on cold boot.
  # Bump back to @165 if cable + monitor + driver combo proves stable.
  mode = 3840x2160@144
  position = 1920x0
  scale = 1
  transform = 0
  # vrr = 1
}

monitorv2 {
  output = desc:Cyrix Corporation XENEON EDGE 040625415656
  mode = 2560x720@60
  position = 2560x2160
  scale = 1
}


monitorv2 {
  output = desc:Samsung Electric Company S24R35x H4TN901181
  mode = 1920x1080@74.97
  position = 0x360
  scale = 1
}


