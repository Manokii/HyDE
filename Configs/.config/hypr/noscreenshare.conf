# Windows hidden from screen capture / screen sharing.
# Toggled as a group by `noscreenshare-toggle` ($mainMod Shift Alt, S), which
# prefixes the active lines below with `#off#` and reloads Hyprland.
# Lines commented with a plain `#` stay off permanently - the toggle skips them.

windowrule = no_screen_share on, match:class ^(1password)$
windowrule = no_screen_share on, match:title ^(Quick Access — 1Password)$
windowrule = no_screen_share on, match:class ^(polkit-gnome-authentication-agent-1)$

